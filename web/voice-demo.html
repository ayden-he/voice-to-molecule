<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice-to-Molecule microphone test</title>
<style>
  body { max-width: 48rem; margin: 3rem auto; padding: 1rem; font: 1.25rem/1.6 system-ui; color: #fff; background: #151515; }
  button, input { font: inherit; padding: .6rem; margin: .4rem 0; }
  input[type=text] { width: 90%; }
  :focus-visible { outline: 4px solid #ffd800; outline-offset: 3px; }
</style>
<h1>Voice-to-Molecule voice demo</h1>
<p>This standalone demo uses a fake command service. It does not build molecules.</p>
<p>Use Chrome on localhost or HTTPS and allow microphone access. Your browser's speech service may send audio to its provider and may need internet access.</p>
<button id="listen">Speak one command</button>
<button id="test">Test microphone only</button>
<button id="cancel" disabled>Cancel listening</button>
<p id="status" role="status" aria-live="polite">Ready. Speak or type a command.</p>
<form id="form">
  <label for="command">Command</label><br>
  <input id="command" type="text" autocomplete="off" placeholder="add carbon">
  <button id="send">Send command</button>
</form>
<label><input id="spoken" type="checkbox" checked> Speak feedback</label>
<p id="feedback" role="status" aria-live="polite"></p>
<script type="module" src="./voice-demo.mjs"></script>
</html>
